# Tests on Windows and Linux on every push. The brief asks for the tool to run on a Windows
# laptop; this is where that is checked, since development happens on a Mac.
# The Episode 50 files are not in the repo, so the tests that need them skip here.
name: tests

on:
  push:
  workflow_dispatch:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test

  # Builds Transcript-QC-Setup.exe, installs it silently, starts the installed app and runs
  # packaging/smoke_test.py against it (sample pair in, counts checked, QC .docx and CSV out).
  # The installer is attached to the run as an artifact.
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: choco install innosetup -y --no-progress
      - run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1
      - name: Install, start and check the app
        run: |
          Start-Process dist\Transcript-QC-Setup.exe -Wait `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          $App = "$env:LOCALAPPDATA\Programs\Transcript QC\Transcript QC.exe"
          if (-not (Test-Path $App)) { throw "The installer did not put the app at $App" }
          Start-Process $App
          python -I packaging\smoke_test.py http://127.0.0.1:8765
          $code = $LASTEXITCODE
          Stop-Process -Name "Transcript QC" -Force -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "The installed app failed the smoke test" }
      - uses: actions/upload-artifact@v4
        with:
          name: Transcript-QC-windows
          path: dist/Transcript-QC-Setup.exe
          if-no-files-found: error
