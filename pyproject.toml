[project]
name = "transcript-qc"
version = "0.1.0"
description = "Compare two Hindi transcripts of one episode, count the mistakes by category and write a QC document"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1",
    "lxml>=5",
    "pyyaml>=6",
    "rapidfuzz>=3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "playwright>=1.45"]

[tool.setuptools]
packages = ["transcript_qc", "transcript_qc.web"]

[tool.setuptools.package-data]
transcript_qc = ["rules.yaml", "rules_strict.yaml"]
"transcript_qc.web" = ["static/*", "static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # test names and expected texts read better on one line
"transcript_qc/web/app.py" = ["B008"]  # File(...) and Form(...) defaults are how FastAPI reads uploads

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
